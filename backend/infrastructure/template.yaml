AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Core serverless infrastructure for the Dollhouse application

Parameters:
  ProjectName:
    Type: String
    Default: dollhouse
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Lowercase project identifier used in resource names and tags.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment represented by this stack.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Origin allowed by API Gateway and asset bucket CORS policies.
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to the infrastructure alarm topic.
  TokenValidityMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: Access and ID token lifetime in minutes.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: provided.al2023
    Handler: bootstrap
    CodeUri: ../
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      SystemLogLevel: INFO
    Environment:
      Variables:
        APP_ENV: !Ref Environment
        USERS_TABLE_NAME: !Ref UsersTable
        FRIENDSHIPS_TABLE_NAME: !Ref FriendshipsTable
        MOOD_EVENTS_TABLE_NAME: !Ref MoodEventsTable
        DEVICES_TABLE_NAME: !Ref DevicesTable
        ASSETS_BUCKET_NAME: !Ref AssetsBucket
        NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Environment
      ManagedBy: AWS-SAM

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/http-api/${ProjectName}-${Environment}'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  DollhouseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      StageName: !Ref Environment
      FailOnWarnings: true
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
          - X-Correlation-Id
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}'
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: AWS-SAM

  GetCurrentProfileFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /profile
            Method: GET

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /profile
            Method: PUT

  GetDollConfigurationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /doll
            Method: GET

  UpdateDollConfigurationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /doll
            Method: PUT

  SearchUsersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /users/search
            Method: GET

  SendFriendRequestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /friend-requests
            Method: POST

  ListFriendRequestsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /friend-requests
            Method: GET

  AcceptFriendRequestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /friend-requests/{requestId}/accept
            Method: POST

  DeclineFriendRequestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /friend-requests/{requestId}/decline
            Method: POST

  RemoveFriendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /friends/{friendId}
            Method: DELETE

  PublishMoodFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /moods
            Method: POST

  GetFriendStatusesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DollhouseApi
            Path: /friend-statuses
            Method: GET

  NotificationConsumerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Timeout: 20
      Events:
        NotificationJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Environment}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: AWS-SAM

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Environment}-mobile'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: !Ref TokenValidityMinutes
      IdTokenValidity: !Ref TokenValidityMinutes
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: User
      Description: Standard Dollhouse application users
      Precedence: 10
      UserPoolId: !Ref UserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: Dollhouse administrators
      Precedence: 1
      UserPoolId: !Ref UserPool

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: normalizedEmail
          AttributeType: S
        - AttributeName: searchPartition
          AttributeType: S
        - AttributeName: normalizedUsername
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: normalizedEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserSearchIndex
          KeySchema:
            - AttributeName: searchPartition
              KeyType: HASH
            - AttributeName: normalizedUsername
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  FriendshipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-friendships'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: relatedUserId
          AttributeType: S
        - AttributeName: statusRelatedUserId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: relatedUserId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserStatusIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: statusRelatedUserId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  MoodEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-mood-events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: occurredAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: occurredAt
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  DevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-devices'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: deviceId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-notifications-dlq'
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-notifications'
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-alerts'
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-api-5xx'
      AlarmDescription: API Gateway returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref DollhouseApi
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-api-latency'
      AlarmDescription: API Gateway p95 latency exceeded two seconds.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref DollhouseApi
        - Name: Stage
          Value: !Ref Environment
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 2000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  NotificationBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-notification-backlog'
      AlarmDescription: Notification jobs are accumulating in the queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

  NotificationDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-notification-dlq'
      AlarmDescription: A notification job was moved to the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: AWS-SAM

Outputs:
  ApiUrl:
    Description: Base URL for the protected Dollhouse API.
    Value: !Sub 'https://${DollhouseApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}'
  ApiId:
    Value: !Ref DollhouseApi
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UsersTableName:
    Value: !Ref UsersTable
  FriendshipsTableName:
    Value: !Ref FriendshipsTable
  MoodEventsTableName:
    Value: !Ref MoodEventsTable
  DevicesTableName:
    Value: !Ref DevicesTable
  AssetsBucketName:
    Value: !Ref AssetsBucket
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
  NotificationDeadLetterQueueUrl:
    Value: !Ref NotificationDeadLetterQueue
  AlertTopicArn:
    Value: !Ref AlertTopic
